<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KALP Universal Output</title><style>:root{--b:#06111a;--l:#294555;--g:#e9bb68;--t:#edf3f7;--m:#8da1ad;--ok:#4ed6a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 65% 0,#173448,#06111a 40%,#03090e);color:var(--t);font:13px system-ui,sans-serif}.top{padding:15px 22px;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:18px}.brand{font:27px Georgia;color:#f4d38c;letter-spacing:3px}.sub{color:#8295a1;font-size:9px;letter-spacing:2px}.wrap{max-width:1500px;margin:auto;padding:16px}.hero{display:flex;justify-content:space-between;align-items:end}.ey{color:var(--g);font-size:10px;font-weight:800;letter-spacing:1.3px}.title{font:27px Georgia;color:#f1cf87;margin:4px 0}.muted{color:var(--m);line-height:1.45}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.btn{padding:9px 12px;border-radius:7px;border:1px solid var(--l);background:#07131d;color:#c8d5dc;cursor:pointer}.btn.active{border-color:#e9bb68;color:#f1cf87}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#091722ee;border:1px solid var(--l);border-radius:9px;padding:13px}.card h3{margin:0 0 6px;color:#f1cf87;font:17px Georgia}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.meta div{background:#07131d;border:1px solid #1e3745;border-radius:6px;padding:8px}.meta small{display:block;color:#718793;font-size:8px}.meta b{font-size:10px}.empty{padding:30px;text-align:center;border:1px dashed var(--l);border-radius:9px;color:var(--m)}pre{white-space:pre-wrap;background:#050e14;padding:10px;border-radius:7px;color:#91a5b0;font-size:9px;max-height:330px;overflow:auto}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">△ KALP</div><div><div class="sub">UNIVERSAL OUTPUT LAYER</div><div>One output surface · Cinematic · Game · Persona Podcast</div></div></header><main class="wrap"><div class="hero"><div><div class="ey">KALP OUTPUT CONTROL</div><div class="title">Universal Output</div><div class="muted">Every studio publishes a common output manifest here. Studio-specific production remains separate.</div></div></div><div class="toolbar"><button class="btn active" data-filter="ALL">ALL</button><button class="btn" data-filter="CINEMATIC_STUDIO">CINEMATIC</button><button class="btn" data-filter="GAME_STUDIO">GAME</button><button class="btn" data-filter="RETRO64_MISSION">RETRO 64</button><button class="btn" data-filter="PERSONA_PODCAST">PERSONA / PODCAST</button><button class="btn" id="refresh">↻ Refresh</button></div><section class="grid" id="grid"></section></main><script>let filter='ALL';function getOutputs(){const out=[];try{const p=JSON.parse(localStorage.getItem('KALP_PERSONA_PODCAST_OUTPUT')||'null');if(p)out.push({output_id:p.output_id||'PERSONA-'+Date.now(),source_studio:'PERSONA_PODCAST',output_type:'PODCAST',status:'GENERATED',created_at:p.created_at||new Date().toISOString(),title:p.topic||'Persona Podcast',persona:{host:p.host,guest:p.guest},assets:{audio:p.universal_output?.audio||'PENDING',video:p.universal_output?.video||'PENDING'},payload:p})}catch(e){}try{const p=JSON.parse(localStorage.getItem('KALP_PRODUCTION_PACKAGE')||'null');if(p){const retro=String(p.production_type||'').toUpperCase()==='RETRO64_MISSION';out.push({output_id:p.output_id||p.scene_id||'CINEMATIC-'+Date.now(),source_studio:retro?'RETRO64_MISSION':'CINEMATIC_STUDIO',output_type:retro?'RETRO64_MISSION':'CINEMATIC_PRODUCTION',status:p.status||'APPROVED',created_at:p.created_at||new Date().toISOString(),title:p.scene_title||'Cinematic Production',production:{scene_id:p.scene_id,frame_count:p.frames?.length||0,shot_count:p.shot_count||p.visual_jobs?.length||0},retro64:retro?{game:p.retro64?.game,intent_mode:p.retro64?.intent_mode,reels:p.retro64?.reels?.length||0,progression_model:p.retro64?.progression_model}:null,assets:{video:p.video||'PENDING'},payload:p})}}catch(e){}return out}function render(){const grid=document.getElementById('grid');const rows=getOutputs().filter(x=>filter==='ALL'||x.source_studio===filter);grid.innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="ey">'+x.source_studio+'</div><h3>'+x.title+'</h3><div class="muted">'+x.output_type+'</div><div class="meta"><div><small>STATUS</small><b>'+x.status+'</b></div><div><small>CREATED</small><b>'+new Date(x.created_at).toLocaleString()+'</b></div><div><small>HOST</small><b>'+((x.persona?.host?.name)||'—')+'</b></div><div><small>GUEST</small><b>'+((x.persona?.guest?.name)||'—')+'</b></div><div><small>AUDIO</small><b>'+((x.assets?.audio)||'—')+'</b></div><div><small>VIDEO</small><b>'+((x.assets?.video)||'—')+'</b></div></div><details style="margin-top:9px"><summary>Manifest</summary><pre>'+JSON.stringify(x.payload,null,2)+'</pre></details></article>').join(''):'<div class="empty" style="grid-column:1/-1">No published outputs yet. Generate an output in a studio and refresh.</div>'}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.getElementById('refresh').onclick=render;render();</script></body></html>
