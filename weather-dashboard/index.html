<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KALP Weather Flash</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <header class="hero">
      <p class="eyebrow">KALP DEVELOPMENT STUDIO</p>
      <h1>Weather Flash</h1>
      <p>Six global cities · Six-day forecast · Live local time</p>
    </header>
    <section id="dashboard" class="grid" aria-live="polite"></section>
    <p id="status" class="status">Loading six cities…</p>
    <button id="refresh" type="button">Refresh</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
