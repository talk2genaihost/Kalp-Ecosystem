name: Wire Retro-64 UI v2
on:
  push:
    paths:
      - 'apps/cinematic-studio/retro64-ui-v2.js'
      - 'apps/cinematic-studio/retro64-ready-bootstrap.js'
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'Wire Retro-64 UI v2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Retro-64 UI and readiness scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/cinematic-studio/index.html')
          s=p.read_text()
          tags=[
              '<script src="retro64-ui-v2.js"></script>',
              '<script src="retro64-ready-bootstrap.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit wired dashboard
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/cinematic-studio/index.html .github/workflows/wire-retro64-ui-v2.yml apps/cinematic-studio/retro64-ready-bootstrap.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore Retro-64 readiness bootstrap'
          git push
