name: Deploy KALP Cinematic Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/cinematic-studio/**'
      - 'data/retro-64-reference.json'
      - '.github/workflows/deploy-kalp-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static dashboard
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp apps/cinematic-studio/index.html dist/index.html
          cp data/retro-64-reference.json dist/data/retro-64-reference.json
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
