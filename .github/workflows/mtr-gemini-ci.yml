name: Market-to-Revenue Integration CI

on:
  pull_request:
    paths:
      - "contracts/market-to-revenue-v01.ts"
      - "src/market-to-revenue/**"
      - "tests/market-to-revenue-v01.test.ts"
      - "package.json"
      - ".github/workflows/mtr-gemini-ci.yml"

jobs:
  verify-mtr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: MTR tests
        run: npm test
