name: RETRO-64 Production Handoff Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retro-64-handoff:
    name: RETRO-64 → Published Cinematic Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KALP-Ecosystem
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Run RETRO-64 browser gate against published Cinematic Studio
        env:
          KALP_CINEMATIC_URL: https://talk2genaihost.github.io/Kalp-Ecosystem/cinematic-studio/
        run: npx playwright test tests/retro-64-browser-smoke.spec.js --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-64-production-handoff-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
