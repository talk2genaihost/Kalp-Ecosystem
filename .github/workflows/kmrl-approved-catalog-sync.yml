name: KMRL Approved Catalog Synchronization
# Governed synchronization workflow for the approved PHY-MEC-007 catalog.

on:
  push:
    branches: [feature/kmrl-collision-authority-evidence]
    paths:
      - scripts/kmrl/sync-approved-collision-catalog.mjs
      - scripts/kmrl/verify-approved-collision-catalog.mjs
      - .github/workflows/kmrl-approved-catalog-sync.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: kmrl-approved-catalog-sync
  cancel-in-progress: true

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Synchronize approved PHY-MEC-007 catalog
        id: sync
        continue-on-error: true
        run: |
          set +e
          node scripts/kmrl/sync-approved-collision-catalog.mjs > /tmp/kmrl-catalog-sync.log 2>&1
          rc=$?
          cat /tmp/kmrl-catalog-sync.log
          printf "exit_code=%s\n" "$rc" > /tmp/kmrl-catalog-sync-status.txt
          cat /tmp/kmrl-catalog-sync.log >> /tmp/kmrl-catalog-sync-status.txt
          exit "$rc"

      - name: Commit synchronization diagnostic
        if: steps.sync.outcome != 'success'
        run: |
          mkdir -p docs/kmrl
          cp /tmp/kmrl-catalog-sync-status.txt docs/kmrl/PHY_MEC_007_CATALOG_SYNC_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kmrl/PHY_MEC_007_CATALOG_SYNC_STATUS.txt
          git commit -m "chore(kmrl): record catalog synchronization diagnostic"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Commit synchronized binary catalog through Git data API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const path = "apps/kmrl-sandbox/KALP_STEM_LAB_MASTER_CATALOG_v1_0.xlsx";
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const parentSha = ref.data.object.sha;
            const parentCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha });
            const content = fs.readFileSync(path).toString("base64");
            const blob = await github.rest.git.createBlob({
              owner, repo, content, encoding: "base64"
            });
            const tree = await github.rest.git.createTree({
              owner, repo,
              base_tree: parentCommit.data.tree.sha,
              tree: [{ path, mode: "100644", type: "blob", sha: blob.data.sha }]
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: "chore(kmrl): synchronize approved PHY-MEC-007 binary catalog",
              tree: tree.data.sha,
              parents: [parentSha]
            });
            await github.rest.git.updateRef({
              owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false
            });
            core.info(`Synchronized binary catalog commit: ${commit.data.sha}`);
            core.info(`Binary catalog blob: ${blob.data.sha}`);

      - name: Verify approved PHY-MEC-007 catalog after synchronization
        id: verify
        continue-on-error: true
        run: node scripts/kmrl/verify-approved-collision-catalog.mjs

      - name: Commit catalog verification receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kmrl/PHY_MEC_007_CATALOG_VERIFICATION.txt
          if git diff --cached --quiet; then
            echo "Verification receipt unchanged"
            exit 0
          fi
          git commit -m "test(kmrl): record approved catalog verification"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Stop on failed catalog synchronization or verification
        if: steps.sync.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
