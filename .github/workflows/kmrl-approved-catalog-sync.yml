name: KMRL Approved Catalog Synchronization
# Governed synchronization workflow for the approved PHY-MEC-007 catalog.

on:
  push:
    branches: [feature/kmrl-collision-authority-evidence]
    paths:
      - scripts/kmrl/sync-approved-collision-catalog.mjs
      - scripts/kmrl/verify-approved-collision-catalog.mjs
      - .github/workflows/kmrl-approved-catalog-sync.yml

permissions:
  contents: write

concurrency:
  group: kmrl-approved-catalog-sync
  cancel-in-progress: true

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Synchronize approved PHY-MEC-007 catalog
        id: sync
        continue-on-error: true
        run: |
          set +e
          node scripts/kmrl/sync-approved-collision-catalog.mjs > /tmp/kmrl-catalog-sync.log 2>&1
          rc=$?
          cat /tmp/kmrl-catalog-sync.log
          printf "exit_code=%s\n" "$rc" > /tmp/kmrl-catalog-sync-status.txt
          cat /tmp/kmrl-catalog-sync.log >> /tmp/kmrl-catalog-sync-status.txt
          exit "$rc"

      - name: Commit synchronization diagnostic
        if: steps.sync.outcome != 'success'
        run: |
          mkdir -p docs/kmrl
          cp /tmp/kmrl-catalog-sync-status.txt docs/kmrl/PHY_MEC_007_CATALOG_SYNC_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kmrl/PHY_MEC_007_CATALOG_SYNC_STATUS.txt
          git commit -m "chore(kmrl): record catalog synchronization diagnostic"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Export synchronized catalog as PR transfer artifact
        run: |
          set -euo pipefail
          base64 -w0 apps/kmrl-sandbox/KALP_STEM_LAB_MASTER_CATALOG_v1_0.xlsx > /tmp/PHY_MEC_007_CATALOG_BASE64.txt

      - name: Publish synchronized binary transfer artifact
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${context.ref.replace("refs/heads/", "")}`;
            const prs = await github.rest.pulls.list({ owner, repo, head, state: "open" });
            if (!prs.data.length) throw new Error(`No open PR found for ${head}`);
            const base64 = fs.readFileSync("/tmp/PHY_MEC_007_CATALOG_BASE64.txt", "utf8").trim();
            const body = [
              "<!-- KMRL-PHY-MEC-007-CATALOG-TRANSFER -->",
              "KMRL PHY-MEC-007 synchronized binary catalog transfer artifact.",
              "Generated from the approved contract synchronization workflow.",
              "BEGIN_BASE64",
              base64,
              "END_BASE64"
            ].join("\n");
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prs.data[0].number,
              body
            });

      - name: Verify approved PHY-MEC-007 catalog after synchronization
        id: verify
        continue-on-error: true
        run: node scripts/kmrl/verify-approved-collision-catalog.mjs

      - name: Commit catalog verification receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kmrl/PHY_MEC_007_CATALOG_VERIFICATION.txt
          if git diff --cached --quiet; then
            echo "Verification receipt unchanged"
            exit 0
          fi
          git commit -m "test(kmrl): record approved catalog verification"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Stop on failed catalog synchronization or verification
        if: steps.sync.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
