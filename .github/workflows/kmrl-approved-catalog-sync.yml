name: KMRL Approved Catalog Synchronization
# Governed synchronization workflow for the approved PHY-MEC-007 catalog.

on:
  push:
    branches: [feature/kmrl-collision-authority-evidence]
    paths:
      - scripts/kmrl/sync-approved-collision-catalog.mjs
      - .github/workflows/kmrl-approved-catalog-sync.yml

permissions:
  contents: write

concurrency:
  group: kmrl-approved-catalog-sync
  cancel-in-progress: true

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify approved PHY-MEC-007 catalog before synchronization
        run: node scripts/kmrl/verify-approved-collision-catalog.mjs
      - name: Commit catalog verification receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kmrl/PHY_MEC_007_CATALOG_VERIFICATION.txt
          if git diff --cached --quiet; then
            echo "Verification receipt unchanged"
            exit 0
          fi
          git commit -m "test(kmrl): record approved catalog verification"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Synchronize approved PHY-MEC-007 catalog
        id: sync
        continue-on-error: true
        run: |
          set +e
          node scripts/kmrl/sync-approved-collision-catalog.mjs > /tmp/kmrl-catalog-sync.log 2>&1
          rc=$?
          cat /tmp/kmrl-catalog-sync.log
          printf "exit_code=%s\n" "$rc" > /tmp/kmrl-catalog-sync-status.txt
          cat /tmp/kmrl-catalog-sync.log >> /tmp/kmrl-catalog-sync-status.txt
          exit "$rc"
      - name: Export synchronized catalog as UTF-8 transfer artifact
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/kmrl-sandbox/KALP_STEM_LAB_MASTER_CATALOG_v1_0.xlsx; then
            echo "Catalog unchanged"
            exit 0
          fi
          mkdir -p docs/kmrl
          base64 -w0 apps/kmrl-sandbox/KALP_STEM_LAB_MASTER_CATALOG_v1_0.xlsx > docs/kmrl/PHY_MEC_007_CATALOG_BASE64.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kmrl/PHY_MEC_007_CATALOG_BASE64.txt
          git commit -m "chore(kmrl): stage synchronized catalog transfer artifact"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
