name: KMRL Approved Catalog Synchronization

on:
  push:
    branches: [feature/kmrl-collision-authority-evidence]
    paths:
      - scripts/kmrl/sync-approved-collision-catalog.mjs
      - .github/workflows/kmrl-approved-catalog-sync.yml

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Synchronize approved PHY-MEC-007 catalog
        run: node scripts/kmrl/sync-approved-collision-catalog.mjs
      - name: Commit synchronized binary catalog
        run: |
          if git diff --quiet -- apps/kmrl-sandbox/KALP_STEM_LAB_MASTER_CATALOG_v1_0.xlsx; then
            echo "Catalog already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/kmrl-sandbox/KALP_STEM_LAB_MASTER_CATALOG_v1_0.xlsx
          git commit -m "chore(kmrl): synchronize approved PHY-MEC-007 catalog"
          git push
