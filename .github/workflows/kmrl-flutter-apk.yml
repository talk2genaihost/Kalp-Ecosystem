name: KMRL Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/kmrl-flutter-sandbox-v0.1

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kmrl_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kmrl-sandbox-flutter-apk
          path: apps/kmrl_flutter/build/app/outputs/flutter-apk/app-release.apk
