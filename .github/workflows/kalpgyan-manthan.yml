name: Kalpgyan Manthan CI
on:
  push:
    paths:
      - "contracts/kalpgyan-manthan-v01.ts"
      - "src/kalpgyan-manthan/**"
      - "tests/kalpgyan-manthan.test.ts"
      - "package.json"
      - "tsconfig.json"
  pull_request:
    paths:
      - "contracts/kalpgyan-manthan-v01.ts"
      - "src/kalpgyan-manthan/**"
      - "tests/kalpgyan-manthan.test.ts"
      - "package.json"
      - "tsconfig.json"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
