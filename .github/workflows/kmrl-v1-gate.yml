name: KMRL v1.0 Integration Gate

on:
  push:
    branches: [feature/kmrl-migration-v1]
  pull_request:
    branches: [feature/kmral-active-impl, main]

jobs:
  kmrl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: KMRL tests
        run: set -o pipefail; npm test 2>&1 | tee test.log
      - name: Repository build
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmrl-v1-gate-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
