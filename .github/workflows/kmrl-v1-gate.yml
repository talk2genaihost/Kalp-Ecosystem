name: KMRL v1.0 Integration Gate

on:
  push:
    branches: [feature/kmrl-migration-v1]
  pull_request:
    branches: [feature/kmral-active-impl, main]
  workflow_dispatch:

jobs:
  kmrl-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: KMRL scoped tests
        run: set -o pipefail; npm run test:kmrl 2>&1 | tee kmrl-test.log

      - name: KMRL scoped TypeScript build
        run: set -o pipefail; npm run build:kmrl 2>&1 | tee kmrl-build.log

      - name: KMRL browser asset preflight
        run: |
          set -euo pipefail
          test -f dist/kmrl/app/main-sandbox-app.js
          test -f apps/kmrl-sandbox/KALP_STEM_LAB_MASTER_CATALOG_v1_0.xlsx
          python3 -m http.server 4173 >/tmp/kmrl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error --head http://127.0.0.1:4173/apps/kmrl-sandbox/index.html
          curl --fail --silent --show-error --head http://127.0.0.1:4173/dist/kmrl/app/main-sandbox-app.js
          curl --fail --silent --show-error --head http://127.0.0.1:4173/apps/kmrl-sandbox/KALP_STEM_LAB_MASTER_CATALOG_v1_0.xlsx
          kill $SERVER_PID
          trap - EXIT

      - name: KMRL MainSandbox browser validation
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 >/tmp/kmrl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npx playwright test tests/kmrl-main-sandbox.spec.js --workers=1

      - name: Repository baseline debt check
        run: |
          test -f docs/kmrl/KMRL_BASELINE_DEBT_REGISTER_V1.md
          grep -q 'PRE-EXISTING' docs/kmrl/KMRL_BASELINE_DEBT_REGISTER_V1.md

      - name: Upload KMRL gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kmrl-v1-scoped-gate-logs
          path: |
            kmrl-build.log
            kmrl-test.log
            /tmp/kmrl-http.log
          if-no-files-found: ignore

      - name: Repository-wide build (informational baseline)
        continue-on-error: true
        run: set -o pipefail; npm run build 2>&1 | tee repository-build-baseline.log

      - name: Repository-wide tests (informational baseline)
        continue-on-error: true
        run: set -o pipefail; npm test 2>&1 | tee repository-test-baseline.log

      - name: Upload repository baseline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmrl-repository-baseline-logs
          path: |
            repository-build-baseline.log
            repository-test-baseline.log
          if-no-files-found: ignore
